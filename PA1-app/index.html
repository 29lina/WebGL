<!doctype html>

<html lang="uk">

<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>
    PA1 - Surface of Revolution of a General Sinusoid
  </title>

  <style>
    html,
    body {
      margin: 0;

      width: 100%;
      height: 100%;

      overflow: hidden;

      font-family:
        Arial,
        sans-serif;

      background:
        #f7f7fa;
    }

    #glCanvas {
      display: block;

      width: 100vw;
      height: 100vh;

      cursor: grab;
    }

    #glCanvas:active {
      cursor: grabbing;
    }

    #info {
      position: fixed;

      top: 16px;
      left: 16px;

      padding:
        10px 14px;

      background:
        rgba(
          255,
          255,
          255,
          0.88
        );

      border:
        1px solid
        rgba(
          0,
          0,
          0,
          0.12
        );

      border-radius: 8px;

      line-height: 1.4;

      font-size: 14px;

      pointer-events: none;
    }
  </style>
</head>

<body>

  <canvas
    id="glCanvas"
  ></canvas>

  <div id="info">

    <strong>
      PA1 - Variant 17
    </strong>

    <br>

    Surface of Revolution
    of a General Sinusoid

    <br>

    a = 1,
    n = 6,
    R = 3

    <br>

    U-curves - blue,
    V-curves - orange

    <br>

    Drag - rotate,
    mouse wheel - zoom

  </div>

  <script
    type="module"
    src="./main.js"
  ></script>

</body>

</html>
