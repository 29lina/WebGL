<!doctype html>

<html lang="uk">

<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>
    PA2 - Phong Shading - Variant 17
  </title>

  <style>
    html,
    body {
      margin: 0;

      width: 100%;
      height: 100%;

      overflow: hidden;

      font-family:
        Arial,
        sans-serif;

      background: #f7f7fa;
    }

    #glCanvas {
      display: block;

      width: 100vw;
      height: 100vh;

      cursor: grab;
    }

    #glCanvas:active {
      cursor: grabbing;
    }

    #controls {
      position: fixed;

      top: 16px;
      left: 16px;

      width: 300px;

      padding: 14px 16px;

      background:
        rgba(
          255,
          255,
          255,
          0.92
        );

      border:
        1px solid
        rgba(
          0,
          0,
          0,
          0.12
        );

      border-radius: 10px;

      line-height: 1.45;

      font-size: 14px;

      box-shadow:
        0 4px 18px
        rgba(
          0,
          0,
          0,
          0.08
        );
    }

    #controls strong {
      font-size: 16px;
    }

    .slider-row {
      margin-top: 12px;
    }

    .slider-row label {
      display: flex;

      justify-content: space-between;

      margin-bottom: 4px;

      font-weight: bold;
    }

    .slider-row input {
      width: 100%;
    }

    .hint {
      margin-top: 12px;

      font-size: 13px;

      color: #555;
    }
  </style>
</head>

<body>

  <canvas
    id="glCanvas"
  ></canvas>

  <div id="controls">

    <strong>
      PA2 - Variant 17
    </strong>

    <br>

    Phong shading

    <br>

    Facet Average vertex normals

    <br>

    Filled indexed triangles

    <div class="slider-row">

      <label>
        <span>U granularity</span>

        <span id="uValue">
          40
        </span>
      </label>

      <input
        id="uSlider"
        type="range"
        min="4"
        max="150"
        value="40"
        step="1"
      >

    </div>

    <div class="slider-row">

      <label>
        <span>V granularity</span>

        <span id="vValue">
          64
        </span>
      </label>

      <input
        id="vSlider"
        type="range"
        min="8"
        max="150"
        value="64"
        step="1"
      >

    </div>

    <div class="hint">
      Drag - rotate<br>
      Mouse wheel - zoom<br>
      Yellow sphere - point light source<br>
      Light source rotates automatically
    </div>

  </div>

  <script
    type="module"
    src="./main.js"
  ></script>

</body>

</html>
